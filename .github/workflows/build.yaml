name: Create Release Pipeline

on:
  release:
    types: [published]

env:
  PROJECT_NAME: SitefinityHelper              # Change this to your project name
  SOLUTION_FILE: ./SitefinityHelper.sln       # Change this to your solution file path
  BUILD_PATH: ./Sitefinity_Helper/bin/Release # Path where the build artifacts are stored
  ZIP_NAME: SitefinityHelper.zip              # Name of the zipped build folder

jobs:
  build-and-release:
    name: Pipeline to Release
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup .NET Framework
        uses: microsoft/setup-msbuild@v1

      - name: Restore NuGet packages
        run: nuget restore

      - name: Build the project
        run: msbuild ${{ env.SOLUTION_FILE }} /p:Configuration=Release

      - name: Zip the build folder
        run: |
          powershell Compress-Archive -Path ${{ env.BUILD_PATH }}\* -DestinationPath ${{ env.BUILD_PATH }}\${{ env.ZIP_NAME }}

      - name: Upload build artifacts
        uses: actions/upload-artifact@v3
        with:
          name: build
          path: ${{ env.BUILD_PATH }}/${{ env.ZIP_NAME }}

      - name: Download build artifacts
        uses: actions/download-artifact@v3
        with:
          name: build

      - name: Upload zip to GitHub release
        uses: softprops/action-gh-release@v1
        with:
          files: ${{ env.BUILD_PATH }}/${{ env.ZIP_NAME }}
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN }}

      - name: Delete source code assets from release
        run: |
          $releaseId = (Invoke-RestMethod -Uri "https://api.github.com/repos/${{ github.repository }}/releases/tags/${{ github.event.release.tag_name }}" -Headers @{Authorization = "token $($env.GITHUB_TOKEN)"}).id
          
          $assets = Invoke-RestMethod -Uri "https://api.github.com/repos/${{ github.repository }}/releases/$releaseId/assets" -Headers @{Authorization = "token $($env.GITHUB_TOKEN)"}
          
          foreach ($asset in $assets) {
            if ($asset.name -like "*source code*") {
              Write-Output "Deleting asset $($asset.id): $($asset.name)"
              Invoke-RestMethod -Uri "https://api.github.com/repos/${{ github.repository }}/releases/assets/$($asset.id)" -Method Delete -Headers @{Authorization = "token $($env.GITHUB_TOKEN)"}
            }
          }
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN }}
